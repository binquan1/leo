<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>我的视频网站</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: Arial;
    }

    header {
      padding: 30px;
      text-align: center;
      font-size: 32px;
      font-weight: bold;
    }

    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
      padding: 30px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 20px;
      overflow: hidden;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    iframe {
      width: 100%;
      height: 220px;
      border: none;
    }

    .content {
      padding: 20px;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .desc {
      color: #ccc;
      margin-bottom: 15px;
    }

    .category {
      display: inline-block;
      background: #ff0033;
      padding: 6px 12px;
      border-radius: 30px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    🎬 我的视频网站
  </header>

  <div class="videos" id="videos"></div>

  <script>
    const videoFiles = [
      "videos/cat-video.md"
    ];

    async function loadVideos() {

      const container = document.getElementById("videos");

      for (const file of videoFiles) {

        const response = await fetch(file);

        const text = await response.text();

        const title = text.match(/title:\s*(.*)/)[1];
        const description = text.match(/description:\s*(.*)/)[1];
        const youtube = text.match(/youtube:\s*(.*)/)[1];
        const category = text.match(/category:\s*(.*)/)[1];

        container.innerHTML += `
          <div class="card">
            <iframe src="${youtube}" allowfullscreen></iframe>

            <div class="content">
              <div class="title">${title}</div>

              <div class="desc">${description}</div>

              <div class="category">${category}</div>
            </div>
          </div>
        `;
      }
    }

    loadVideos();
  </script>

</body>

</html>
