<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Leo视频网站</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: Arial;
    }

    header {
      padding: 30px;
      text-align: center;
      font-size: 32px;
      font-weight: bold;
    }

    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
      padding: 30px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 20px;
      overflow: hidden;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    iframe {
      width: 100%;
      height: 220px;
      border: none;
    }

    .content {
      padding: 20px;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .desc {
      color: #ccc;
      margin-bottom: 15px;
    }

    .category {
      display: inline-block;
      background: #ff0033;
      padding: 6px 12px;
      border-radius: 30px;
      font-size: 14px;
    }
  </style>
<style>

header {
  padding: 40px;
  text-align: center;
}

header h1 {
  font-size: 42px;
  margin-bottom: 10px;
  color: white;
}

header p {
  color: #999;
  font-size: 18px;
}

.filters {
  text-align: center;
  margin-bottom: 20px;
}

.filters button {
  background: #ff0033;
  border: none;
  color: white;
  padding: 10px 20px;
  margin: 5px;
  border-radius: 30px;
  cursor: pointer;
  font-size: 16px;
}

.filters button:hover {
  opacity: 0.8;
}

</style>
</head>

<body>

  <header>
    🎬 Leo视频网站
  </header>

  <div class="videos" id="videos"></div>

  <script>

async function loadVideos() {

  const container = document.getElementById("videos");

  const response = await fetch("video-list.json");

  const videoFiles = await response.json();

  for (const file of videoFiles) {

    const res = await fetch(file);

    const text = await res.text();

    const title = text.match(/title:\s*(.*)/)[1];
    const description = text.match(/description:\s*(.*)/)[1];
    const youtube = text.match(/youtube:\s*(.*)/)[1];
    const category = text.match(/category:\s*(.*)/)[1];

    container.innerHTML += `
      <div class="card" data-category="${category}">
        <iframe src="${youtube}" allowfullscreen></iframe>

        <div class="content">
          <div class="title">${title}</div>

          <div class="desc">${description}</div>

          <div class="category">${category}</div>
        </div>
      </div>
    `;
  }
}

loadVideos();

function filterVideos(category) {

  const cards = document.querySelectorAll(".card");

  cards.forEach(card => {

    if (
      category === "全部" ||
      card.dataset.category === category
    ) {

      card.style.display = "block";

    } else {

      card.style.display = "none";

    }

  });

}
  </script>

</body>

</html>
