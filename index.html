<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>Tony's Kitchen</title>

    <style>
        body {
            margin: 0;
            background: #0f0f0f;
            font-family: Arial;
            color: white;
        }

        .header {
            background: #181818;
            padding: 20px;
            font-size: 32px;
            font-weight: bold;
            color: orange;
        }

        .container {
            width: 90%;
            margin: auto;
        }

        .categories {
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .categories button {
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 10px 20px;
            margin-right: 10px;
            border-radius: 20px;
            cursor: pointer;
        }

        .categories button:hover {
            background: orange;
            color: black;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .video-card {
            background: #1a1a1a;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
        }

        .video-card:hover {
            transform: scale(1.03);
        }

        iframe {
            width: 100%;
            height: 220px;
            border: none;
        }

        .video-info {
            padding: 15px;
        }

        .video-title {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .video-desc {
            color: #aaa;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <div class="header">
        🍕 Tony's Kitchen
    </div>

    <div class="container">

        <div class="categories">
            <button>全部</button>
            <button>美食</button>
            <button>甜品</button>
            <button>披萨</button>
            <button>早餐</button>
        </div>

        <div class="video-grid">

            <div class="video-card">

                <iframe src="https://www.youtube.com/embed/jNQXAC9IVRw"
                    allowfullscreen>
                </iframe>

                <div class="video-info">

                    <div class="video-title">
                        我的第一个视频
                    </div>

                    <div class="video-desc">
                        这是我的视频网站测试视频。
                    </div>

                </div>

            </div>

            <div class="video-card">

                <iframe src="https://www.youtube.com/embed/aqz-KE-bpKQ"
                    allowfullscreen>
                </iframe>

                <div class="video-info">

                    <div class="video-title">
                        第二个视频
                    </div>

                    <div class="video-desc">
                        这是第二个测试视频。
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
